version: '3.8'

services:
  wordpress:
    image: wordpress:latest
    ports:
      - 10000:80   # Expose WordPress on host port 8080
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: DMhNu
      WORDPRESS_DB_PASSWORD: tBD1Mn5GhVHXTxAcPD67
      WORDPRESS_DB_NAME: bjmNgAvTtq
    networks:
      - wp-network
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bjmNgAvTtq
      MYSQL_USER: DMhNu
      MYSQL_PASSWORD: tBD1Mn5GhVHXTxAcPD67
      MYSQL_ROOT_PASSWORD: RbJ1ftcNWwydfROPB6yBN3ugareH6hoUMtiCPde5
    expose:
      - 3306  # Expose only to other containers in the same network
    networks:
      - wp-network
    volumes:
      - db_data:/var/lib/mysql

volumes:
  wp_data:
  db_data:

networks:
  wp-network:
    driver: bridge
