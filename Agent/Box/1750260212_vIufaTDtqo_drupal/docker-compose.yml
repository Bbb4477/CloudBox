version: '3.8'

services:
  drupal:
    image: drupal:latest
    ports:
      - PORT:80   # Expose Drupal on dynamic host port
    environment:
      DRUPAL_DB_HOST: db
      DRUPAL_DB_USER: TTbhD
      DRUPAL_DB_PASSWORD: 6IhPhMP19EHVObSurG0x
      DRUPAL_DB_NAME: zYzyDmGddO
    networks:
      - drupal-network
    volumes:
      - drupal_data:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: zYzyDmGddO
      MYSQL_USER: TTbhD
      MYSQL_PASSWORD: 6IhPhMP19EHVObSurG0x
      MYSQL_ROOT_PASSWORD: HDN3glCmNG1cr61KDlxvqjQsV4iY58yjrTHxFeXp
    expose:
      - 3306  # Expose only to other containers in the same network
    networks:
      - drupal-network
    volumes:
      - db_data:/var/lib/mysql

volumes:
  drupal_data:
  db_data:

networks:
  drupal-network:
    driver: bridge
