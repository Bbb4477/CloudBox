version: '3.8'
services:
  nginx:
    image: nginx:latest
    ports:
      - "{Export_port}:80"  # e.g., 10000:80
    networks:
      - nginx-network
    volumes:
      - nginx_config:/etc/nginx/conf.d
    environment:
      - NGINX_PORT=80
volumes:
  nginx_config:
networks:
  nginx-network:
    driver: bridge