version: '3.8'

services:
  drupal:
    image: drupal:latest
    ports:
      - "{Export_port}:80"   # Expose Drupal on dynamic host port
    environment:
      DRUPAL_DB_HOST: db
      DRUPAL_DB_USER: {DB_username}
      DRUPAL_DB_PASSWORD: {DB_password}
      DRUPAL_DB_NAME: {DB_name}
    networks:
      - drupal-network
    volumes:
      - drupal_data:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: {DB_name}
      MYSQL_USER: {DB_username}
      MYSQL_PASSWORD: {DB_password}
      MYSQL_ROOT_PASSWORD: {DB_rootpassword}
    expose:
      - "3306"  # Expose only to other containers in the same network
    networks:
      - drupal-network
    volumes:
      - db_data:/var/lib/mysql

volumes:
  drupal_data:
  db_data:

networks:
  drupal-network:
    driver: bridge