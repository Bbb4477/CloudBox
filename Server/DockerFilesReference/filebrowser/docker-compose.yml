version: '3.8'

services:
  filebrowser:
    image: filebrowser/filebrowser:latest
    ports:
      - "{Export_port}:80"  # Expose File Browser on dynamically assigned host port
    networks:
      - fb-network
    volumes:
      - fb_data:/srv
      - fb_config:/config
    environment:
      - FB_BASEURL=/filebrowser
      - FB_PORT=80
      - FB_ADDRESS=0.0.0.0

volumes:
  fb_data:
  fb_config:

networks:
  fb-network:
    driver: bridge