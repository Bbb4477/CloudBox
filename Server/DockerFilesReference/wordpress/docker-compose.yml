version: '3.8'

services:
  wordpress:
    image: wordpress:latest
    ports:
      - "{Export_port}:80"   # Expose WordPress on host port 8080
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: {WP_DB_username}
      WORDPRESS_DB_PASSWORD: {WP_DB_password}
      WORDPRESS_DB_NAME: {WP_DB_name}
    networks:
      - wp-network
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: {WP_DB_name}
      MYSQL_USER: {WP_DB_username}
      MYSQL_PASSWORD: {WP_DB_password}
      MYSQL_ROOT_PASSWORD: {WP_DB_rootpassword}
    expose:
      - "3306"  # Expose only to other containers in the same network
    networks:
      - wp-network
    volumes:
      - db_data:/var/lib/mysql

volumes:
  wp_data:
  db_data:

networks:
  wp-network:
    driver: bridge